<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GTP Reader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 12px; width: 360px; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      button { padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer; }
      #test { background: #111; color: #fff; }
      #output { white-space: pre-wrap; background: #f6f6f6; padding: 10px; border-radius: 8px; min-height: 64px; margin-top: 10px; }
      .muted { color: #666; font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>GTP Reader</h1>
    <button id="test">Test proxy</button>
    <div id="output"></div>
    <div class="muted">This verifies your Cloudflare proxy + streaming.</div>

    <!-- Load external module (Manifest V3 forbids inline scripts) -->
    <script type="module" src="./popup.js"></script>
  </body>
</html>
